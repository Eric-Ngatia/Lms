services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cla
      POSTGRES_PASSWORD: cla_dev_password
      POSTGRES_DB: cla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cla -d cla"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
